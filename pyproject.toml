[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codemind"
version = "0.1.0"
description = "Local-first AI coding assistant powered by Ollama with validated structured output."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
codemind = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.txt", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Ollama with an installed model (opt in with -m integration)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: the formatter already wraps code; remaining long lines are string literals.
# UP046/UP047: TypeVar-style generics are kept for readability.
ignore = ["E501", "UP046", "UP047"]
